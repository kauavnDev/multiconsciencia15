name: Build verification
on:
  push:
    branches:
      - infra/render-temporary-hosting
      - feature/operations-engine
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder
          GEMINI_API_KEY: build-placeholder
          GROQ_API_KEY: build-placeholder
          OPENROUTER_API_KEY: build-placeholder
          AI_ALLOW_PAID: "false"
